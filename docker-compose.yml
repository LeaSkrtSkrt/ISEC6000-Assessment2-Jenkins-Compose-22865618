services:

  # Docker-in-Docker service.
  # Provides an isolated Docker daemon for Jenkins pipeline builds.
  docker:
    image: docker:27-dind
    container_name: jenkins-docker
    privileged: true
    restart: unless-stopped

    environment:
      # Enables TLS for communication with the Docker daemon.
      DOCKER_TLS_CERTDIR: /certs

    volumes:
      # Stores TLS client certificates shared with Jenkins.
      - jenkins-docker-certs:/certs/client

      # Persists Docker images and build layers.
      - jenkins-docker-data:/var/lib/docker

      # Shares the Jenkins workspace with DinD so containerised
      # pipeline agents can access the same workspace paths.
      - jenkins-data:/var/jenkins_home

    networks:
      - jenkins-net

    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 10


  # Jenkins controller service.
  # Runs CI/CD jobs and communicates with DinD using TLS.
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins

    container_name: jenkins
    restart: unless-stopped

    depends_on:
      docker:
        condition: service_healthy

    ports:
      # Jenkins web interface is restricted to localhost.
      - "127.0.0.1:8080:8080"

    environment:
      # Address of the Docker-in-Docker daemon.
      DOCKER_HOST: tcp://docker:2376

      # Location of TLS client certificates.
      DOCKER_CERT_PATH: /certs/client

      # Require TLS certificate verification.
      DOCKER_TLS_VERIFY: "1"

    volumes:
      # Persists Jenkins jobs, plugins, configuration and build history.
      - jenkins-data:/var/jenkins_home

      # Provides read-only Docker TLS certificates to Jenkins.
      - jenkins-docker-certs:/certs/client:ro

    networks:
      - jenkins-net

    security_opt:
      # Prevent processes from acquiring additional privileges.
      - no-new-privileges:true


# Persistent named volumes.
volumes:
  jenkins-data:
  jenkins-docker-certs:
  jenkins-docker-data:


# Dedicated network for Jenkins and Docker-in-Docker communication.
networks:
  jenkins-net:
    driver: bridge
